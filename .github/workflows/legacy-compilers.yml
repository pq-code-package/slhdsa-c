name: Legacy compilers
permissions:
  contents: read
on:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  compiler_tests_linux:
    name: Compiler tests (${{ matrix.compiler.family }}-${{ matrix.compiler.version }}, ${{ matrix.target.name }}, ${{ matrix.cflags }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'legacy-compiler-tests'))
    strategy:
      fail-fast: false
      matrix:
        cflags: [ "-O0", "-Os", "-O3" ]
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
        # All available compiler versions are tested here, including those also
        # covered by ci.yml on every PR.
        # C17 support starts at gcc 8, clang 7, all zig; C23 at gcc 14, clang 18,
        # zig 0.14 (encoded in the C17/C23 step conditions below).
        compiler:
         - family: gcc
           version: "4.8"
           shell: gcc48
         - family: gcc
           version: "4.9"
           shell: gcc49
         - family: gcc
           version: "6"
           shell: gcc6
         - family: gcc
           version: "7"
           shell: gcc7
         - family: gcc
           version: "8"
           shell: gcc8
         - family: gcc
           version: "9"
           shell: gcc9
         - family: gcc
           version: "10"
           shell: gcc10
         - family: gcc
           version: "11"
           shell: gcc11
         - family: gcc
           version: "12"
           shell: gcc12
         - family: gcc
           version: "13"
           shell: gcc13
         - family: gcc
           version: "14"
           shell: gcc14
         - family: gcc
           version: "15"
           shell: gcc15
         - family: gcc
           version: "16"
           shell: gcc16
         - family: clang
           version: "6"
           shell: clang6
         - family: clang
           version: "7"
           shell: clang7
         - family: clang
           version: "8"
           shell: clang8
         - family: clang
           version: "9"
           shell: clang9
         - family: clang
           version: "10"
           shell: clang10
         - family: clang
           version: "11"
           shell: clang11
         - family: clang
           version: "12"
           shell: clang12
         - family: clang
           version: "13"
           shell: clang13
         - family: clang
           version: "14"
           shell: clang14
         - family: clang
           version: "15"
           shell: clang15
         - family: clang
           version: "16"
           shell: clang16
         - family: clang
           version: "17"
           shell: clang17
         - family: clang
           version: "18"
           shell: clang18
         - family: clang
           version: "19"
           shell: clang19
         - family: clang
           version: "20"
           shell: clang20
         - family: clang
           version: "21"
           shell: clang21
         - family: clang
           version: "22"
           shell: clang22
         - family: clang
           version: "23"
           shell: clang23
         - family: zig
           version: "0.10"
           shell: zig0_10
         - family: zig
           version: "0.11"
           shell: zig0_11
         - family: zig
           version: "0.12"
           shell: zig0_12
         - family: zig
           version: "0.13"
           shell: zig0_13
         - family: zig
           version: "0.14"
           shell: zig0_14
         - family: zig
           version: "0.15"
           shell: zig0_15
         - family: zig
           version: "0.16"
           shell: zig0_16
         - family: zig
           version: "0.17"
           shell: zig0_17
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: native build+functest (default)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C90)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c90 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C99)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c99 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C11)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c11 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C17)
        if: ${{ matrix.compiler.family == 'zig' || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 8) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 7) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c17 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C23)
        if: ${{ (matrix.compiler.family == 'zig' && matrix.compiler.version >= 0.14) || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 14) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 18) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c23 ${{ matrix.cflags }}"
          quick: 'true'

  compiler_tests_macos:
    name: Compiler tests (${{ matrix.compiler.family }}-${{ matrix.compiler.version }}, macos, ${{ matrix.cflags }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'legacy-compiler-tests'))
    strategy:
      fail-fast: false
      matrix:
        cflags: [ "-O0", "-Os", "-O3" ]
        # Subset of compiler_tests_linux known to build on aarch64-darwin.
        compiler:
         - family: gcc
           version: "11"
           shell: gcc11
         - family: gcc
           version: "14"
           shell: gcc14
         - family: gcc
           version: "15"
           shell: gcc15
         - family: gcc
           version: "16"
           shell: gcc16
         - family: clang
           version: "18"
           shell: clang18
         - family: clang
           version: "19"
           shell: clang19
         - family: clang
           version: "20"
           shell: clang20
         - family: clang
           version: "21"
           shell: clang21
         - family: clang
           version: "22"
           shell: clang22
         - family: clang
           version: "23"
           shell: clang23
         - family: zig
           version: "0.12"
           shell: zig0_12
         - family: zig
           version: "0.13"
           shell: zig0_13
         - family: zig
           version: "0.14"
           shell: zig0_14
         - family: zig
           version: "0.15"
           shell: zig0_15
         - family: zig
           version: "0.16"
           shell: zig0_16
         - family: zig
           version: "0.17"
           shell: zig0_17
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: native build+functest (default)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C90)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c90 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C99)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c99 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C11)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c11 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C17)
        if: ${{ matrix.compiler.family == 'zig' || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 8) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 7) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c17 ${{ matrix.cflags }}"
          quick: 'true'
      - name: native build+functest (C23)
        if: ${{ (matrix.compiler.family == 'zig' && matrix.compiler.version >= 0.14) || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 14) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 18) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c23 ${{ matrix.cflags }}"
          quick: 'true'

  compiler_tests_windows_mingw:
    name: Compiler tests (Mingw-w64 ${{ matrix.mingw-version }}, x86_64)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'legacy-compiler-tests'))
    strategy:
      fail-fast: false
      matrix:
        mingw-version:
         - "5.4.0"
         - "6.4.0"
         - "7.5.0"
         - "8.5.0"
         - "9.4.0"
         - "10.3.0"
         - "11.2.0"
         - "12.2.0"
         - "13.2.0"
         - "14.2.0"
         - "15.2.0"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MinGW-w64
        run: choco install mingw --version=${{ matrix.mingw-version }} -y
        # choco needs cmd here.
        shell: cmd
      - name: Run ACVP test (quick)
        shell: bash
        run: |
          gcc --version
          CC=gcc make xfips205
          python test/acvp_client.py --quick
