name: Base
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  quickcheck:
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
         - runner: macos-latest
           name: 'macos (aarch64)'
         - runner: macos-15-intel
           name: 'macos (x86_64)'
        acvp-version: [v1.1.0.40, v1.1.0.39]
    name: Quickcheck (${{ matrix.target.name }}, ACVP ${{ matrix.acvp-version }})
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ACVP test
        run: |
          make
          python3 test/acvp_client.py --version ${{ matrix.acvp-version }}
  quickcheck-c90:
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
    name: Quickcheck C90 (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: make quickcheck
        run: |
          CFLAGS=-std=c90 make test

  scan-build:
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
    name: scan-build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install scan-build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools clang
      - name: scan-build
        run: |
          scan-build --status-bugs make
  quickcheck-windows:
    strategy:
      fail-fast: false
      matrix:
        system: [windows-2025, windows-2022]
    name: Quickcheck ${{ matrix.system }}
    runs-on: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Run ACVP test
        shell: powershell
        run: |
          # print compiler version
          cl
          nmake /f ./Makefile.Microsoft_nmake test
  quickcheck-windows-mingw-w64:
    strategy:
      fail-fast: false
      matrix:
        mingw-version: [5.4.0, 13.2.0, 14.2.0, 15.2.0]
    name: Quickcheck (Mingw-w64 ${{ matrix.mingw-version }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MinGW-w64
        run: choco install mingw --version=${{ matrix.mingw-version }} -y
        # choco needs cmd here.
        shell: cmd
      - name: Run ACVP test (quick)
        shell: bash
        run: |
          gcc --version
          CC=gcc make xfips205
          python test/acvp_client.py --quick
