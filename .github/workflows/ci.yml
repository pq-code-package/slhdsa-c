name: Extended
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  compiler_tests:
    name: Compiler tests  (${{ matrix.compiler.name }}, ${{ matrix.target.name }}, ${{ matrix.cflags }})
    strategy:
      fail-fast: false
      matrix:
        cflags: [ "-Os", "-O3" ]
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
           archflags: ''
         - runner: ubuntu-latest
           name: 'x86_64'
           archflags: '-mavx2 -mbmi2 -mpopcnt -maes'
         - runner: macos-latest
           name: 'macos'
           archflags: ''
        compiler:
         - name: gcc-4.8
           shell: gcc48
           darwin: False
         - name: gcc-4.9
           shell: gcc49
           darwin: False
         - name: gcc-7
           shell: gcc7
           darwin: False
         - name: gcc-11
           shell: gcc11
           # TODO: re-enable on macOS (nix gcc fails with duplicate LC_RPATH)
           darwin: False
         - name: gcc-13
           shell: gcc13
           # TODO: re-enable on macOS (nix gcc fails with duplicate LC_RPATH)
           darwin: False
         - name: gcc-14
           shell: gcc14
           # TODO: re-enable on macOS (nix gcc fails with duplicate LC_RPATH)
           darwin: False
         - name: clang-18
           shell: clang18
           darwin: True
         - name: clang-19
           shell: clang19
           darwin: True
         - name: clang-20
           shell: clang20
           darwin: True
         - name: clang-21
           shell: clang21
           darwin: True
         # CPU flags are not correctly passed to the zig assembler
         # https://github.com/ziglang/zig/issues/23576
         # We therefore only test the C backend
         #
         # We omit all examples since there is currently no way to run
         # only those examples not involving native code.
         # TODO: compiling with zig leads to test failures right now - needs to be revisited.
         #- name: zig-0.12
         #  shell: zig0_12
         #  darwin: True
         #- name: zig-0.13
         #  shell: zig0_13
         #  darwin: True
         #- name: zig-0.14
         #  shell: zig0_14
         #  darwin: True
        exclude:
          # Exclude old GCC versions from macOS and aarch64 runners
          - target: { name: 'macos' }
            compiler: { darwin: False }
          - target: { name: 'aarch64' }
            compiler: { darwin: False }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build+functest (default)
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "${{ matrix.cflags }} ${{ matrix.target.archflags }}"
      - name: native build+functest (C90)
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c90 ${{ matrix.cflags }} ${{ matrix.target.archflags }}"
      - name: native build+functest (C99)
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c99 ${{ matrix.cflags }} ${{ matrix.target.archflags }}"
  cross_tests:
    name: Cross tests (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'x86_64'
           nix_shell: cross-x86_64
           platform: linux/x86_64
         - runner: ubuntu-latest
           name: 'aarch64'
           nix_shell: cross-aarch64
           platform: linux/aarch64
         - runner: ubuntu-latest
           name: 'aarch64_be'
           nix_shell: cross-aarch64_be
           platform: linux/aarch64_be
         - runner: ubuntu-24.04-arm
           name: 'ppc64le'
           nix_shell: cross-ppc64le
           platform: linux/ppc64le
         - runner: ubuntu-24.04-arm
           name: 'riscv64'
           nix_shell: cross-riscv64
           platform: linux/riscv64
         - runner: ubuntu-24.04-arm
           name: 'riscv32'
           nix_shell: cross-riscv32
           platform: linux/riscv32
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build+functest (cross, quick)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: 'true'
          platform: ${{ matrix.target.platform }}
          quick: 'true'
  sanitizer_tests:
    name: Sanitizer tests (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-latest
           name: 'x86_64'
           nix_shell: ci
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
           nix_shell: ci
         - runner: macos-latest
           name: 'macos'
           # clang < 22 ASan runtime deadlocks at startup on macOS 26
           # (llvm/llvm-project#191039)
           nix_shell: clang22
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build+functest (ASan+UBSan)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.target.nix_shell }}
          cflags: "-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
