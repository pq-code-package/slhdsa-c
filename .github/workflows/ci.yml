name: Extended
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  compiler_tests:
    name: Compiler tests  (${{ matrix.compiler.family }}-${{ matrix.compiler.version }}, ${{ matrix.target.name }}, ${{ matrix.cflags }})
    strategy:
      fail-fast: false
      matrix:
        cflags: [ "-O0", "-Os", "-O3" ]
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
         - runner: macos-latest
           name: 'macos'
        # Oldest available + 3 latest per family
        compiler:
         - family: gcc
           version: "4.8"
           shell: gcc48
           darwin: False
         - family: gcc
           version: "14"
           shell: gcc14
           darwin: True
         - family: gcc
           version: "15"
           shell: gcc15
           darwin: True
         - family: gcc
           version: "16"
           shell: gcc16
           darwin: True
         - family: clang
           version: "6"
           shell: clang6
           darwin: False
         - family: clang
           version: "21"
           shell: clang21
           darwin: True
         - family: clang
           version: "22"
           shell: clang22
           darwin: True
         - family: clang
           version: "23"
           shell: clang23
           darwin: True
         - family: zig
           version: "0.10"
           shell: zig0_10
           darwin: False
         - family: zig
           version: "0.15"
           shell: zig0_15
           darwin: True
         - family: zig
           version: "0.16"
           shell: zig0_16
           darwin: True
         - family: zig
           version: "0.17"
           shell: zig0_17
           darwin: True
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: native build+functest (default)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "${{ matrix.cflags }}"
          coverage: quick
      - name: native build+functest (C90)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c90 ${{ matrix.cflags }}"
          coverage: quick
      - name: native build+functest (C99)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c99 ${{ matrix.cflags }}"
          coverage: quick
      - name: native build+functest (C11)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c11 ${{ matrix.cflags }}"
          coverage: quick
      - name: native build+functest (C17)
        if: ${{ (matrix.compiler.darwin || matrix.target.runner != 'macos-latest') &&
                (matrix.compiler.family == 'zig' || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 8) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 7)) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c17 ${{ matrix.cflags }}"
          coverage: quick
      - name: native build+functest (C23)
        if: ${{ (matrix.compiler.darwin || matrix.target.runner != 'macos-latest') &&
                ((matrix.compiler.family == 'zig' && matrix.compiler.version >= 0.14) || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 14) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 18)) }}
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c23 ${{ matrix.cflags }}"
          coverage: quick
  cross_tests:
    name: Cross tests (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'x86_64'
           nix_shell: cross-x86_64
           platform: linux/x86_64
         - runner: ubuntu-latest
           name: 'aarch64'
           nix_shell: cross-aarch64
           platform: linux/aarch64
         - runner: ubuntu-latest
           name: 'aarch64_be'
           nix_shell: cross-aarch64_be
           platform: linux/aarch64_be
         - runner: ubuntu-24.04-arm
           name: 'ppc64le'
           nix_shell: cross-ppc64le
           platform: linux/ppc64le
         - runner: ubuntu-24.04-arm
           name: 'riscv64'
           nix_shell: cross-riscv64
           platform: linux/riscv64
         - runner: ubuntu-24.04-arm
           name: 'riscv32'
           nix_shell: cross-riscv32
           platform: linux/riscv32
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build+functest (cross, quick)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: 'true'
          platform: ${{ matrix.target.platform }}
          coverage: quick
  sanitizer_tests:
    name: Sanitizer tests (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-latest
           name: 'x86_64'
           nix_shell: ci
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
           nix_shell: ci
         - runner: macos-latest
           name: 'macos'
           # clang < 22 ASan runtime deadlocks at startup on macOS 26
           # (llvm/llvm-project#191039)
           nix_shell: clang22
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build+functest (ASan+UBSan)
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: ${{ matrix.target.nix_shell }}
          cflags: "-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
