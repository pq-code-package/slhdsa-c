name: CT Test
description: Builds the library with given flags and runs Valgrind-based constant-time tests

inputs:
  cflags:
    description: CFLAGS to pass to compilation
    default: ""
  valgrind_flags:
    description: Extra flags to pass to valgrind
    default: ""

runs:
  using: composite
  steps:
      - name: System info
        shell: ${{ env.SHELL }}
        run: |
          ARCH=$(uname -m)
          cat >> $GITHUB_STEP_SUMMARY <<-EOF
            ## Setup
            Architecture: $ARCH
            - $(uname -a)
            - $(nix --version || echo 'nix not present')
            - $(bash --version | grep -m1 "")
            - $(python3 --version)
            - $("${CC}" --version | grep -m1 "")
            - $(valgrind --version)
          EOF
      - shell: ${{ env.SHELL }}
        env:
          CFLAGS_EXTRA: ${{ inputs.cflags }}
          VALGRIND_FLAGS: ${{ inputs.valgrind_flags }}
        run: |
          ./scripts/tests --coverage=minimal --exec-wrapper="valgrind --error-exitcode=1 $VALGRIND_FLAGS" --cflags="-DSLH_CONFIG_CT_TESTING_ENABLED $CFLAGS_EXTRA"
