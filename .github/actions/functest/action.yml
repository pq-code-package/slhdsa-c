name: Functional tests
description: Run functional tests

inputs:
  nix-shell:
    description: Run in the specified Nix environment if exists
    default: "ci"
  custom_shell:
    description: The shell to use. Only relevant if no nix-shell specified
    default: "bash"
  nix-cache:
    description: Determine whether to enable nix cache
    default: 'false'
  nix-verbose:
    description: Determine wether to suppress nix log or not
    default: 'false'
  gh_token:
    description: Github access token to use
    required: true
  cflags:
    description: CFLAGS to pass to compilation
    default: ""
  platform:
    description: Test platform profile (see scripts/tests)
    default: "native"
  coverage:
    description: ACVP test coverage (full | quick | minimal)
    default: 'full'
  func:
    description: Determine whether to run the functional test or not
    default: 'true'
  acvp:
    description: Determine whether to run the ACVP tests or not
    default: 'true'

runs:
  using: composite
  steps:
      - uses: ./.github/actions/setup-nix
        with:
          devShell: ${{ inputs.nix-shell }}
          cache: ${{ inputs.nix-cache }}
          verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
      - name: Functional tests
        shell: ${{ env.SHELL }}
        env:
          TEST_CFLAGS: ${{ inputs.cflags }}
          TEST_PLATFORM: ${{ inputs.platform }}
          TEST_COVERAGE: ${{ inputs.coverage }}
          FUNC: ${{ inputs.func == 'true' && 'func' || 'no-func' }}
          ACVP: ${{ inputs.acvp == 'true' && 'acvp' || 'no-acvp' }}
        run: |
          ./scripts/tests all --platform="$TEST_PLATFORM" --cflags="$TEST_CFLAGS" --coverage="$TEST_COVERAGE" --"$FUNC" --"$ACVP"

